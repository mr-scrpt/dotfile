# Minimal configuration for yd (dual-pane yazi)
# This avoids loading heavy plugins that interfere with terminal signals

# Essential for yazi image preview and terminal signaling
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Basic UI settings
set -g mouse on
set -g status-position bottom
set -g status-style 'bg=default,fg=white'

# Ensure 256 colors
set -g default-terminal "screen-256color" 
set -a terminal-overrides ",xterm-256color:RGB"

# Basic keys (optional, for comfort)
# You can add essential bindings here if needed, but keep it minimal.
