# Terminal multiplexer
# https://github.com/tmux/tmux

# ============================================================================
# БАЗОВЫЕ НАСТРОЙКИ
# ============================================================================

# Префикс (оставляем для совместимости, но основные биндинги будут через Alt)
set -g prefix C-n
unbind C-b
bind-key C-n send-prefix

# set -sa terminal-features ",*:extkeys"
# Включаем RGB (TrueColor) и поддержку расширенных ключей для внешнего терминала
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:extkeys'


# ============================================================================
# ФИКС КЛАВИАТУРЫ (Ghostty / Kitty protocol)
# ============================================================================
set -g xterm-keys on
set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
set-option -g default-terminal 'tmux-256color'





# # Терминал и цвета
# set-option -g default-terminal 'screen-256color'
# set-option -g terminal-overrides ',xterm-256color:RGB'

# Базовые опции
set -g base-index 1                # окна начинаются с 1
set -g pane-base-index 1           # панели начинаются с 1
set -g detach-on-destroy off       # не выходить из tmux при закрытии сессии
set -g escape-time 0               # убрать задержку escape
set -g history-limit 1000000       # большая история
set -g mouse on                    # поддержка мыши

# Passthrough для корректной работы yazi и других TUI приложений
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g renumber-windows on         # перенумеровывать окна
set -g set-clipboard on            # использовать системный буфер
set -g status-interval 2           # обновление статуса каждые 2 секунды
setw -g mode-keys vi               # vi режим в copy mode

# ============================================================================
# ВНЕШНИЙ ВИД
# ============================================================================

set -g status-position bottom
set -g status-justify right
set -g status-left ''
set -g status-right '  #[fg=black,bg=blue,bold]  _#S    '
set -g status-right-length 200
set -g status-style 'bg=default'

# Стили окон
set -g window-status-current-format '#[fg=black,bg=magenta,bold] #W '
set -g window-status-format '#[fg=gray]#W'
set-window-option -g window-status-separator ' '

# Стили границ панелей
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Catppuccin Mocha Mode Styles (Selection/Copy Mode)
set -g mode-style "fg=#cdd6f4,bg=#585b70"
set -g message-style "fg=#cdd6f4,bg=#585b70"
set -g message-command-style "fg=#cdd6f4,bg=#585b70"

set -g pane-border-lines double
# ============================================================================
# БИНДИНГИ С CTRL+ALT (ОСНОВНЫЕ)
# ============================================================================

# --- Управление окнами и сессиями ---
bind -n C-M-t new-window -c '#{pane_current_path}'           # создать окно
bind -n C-M-i rename-window ''                               # переименовать окно
bind -n C-M-d detach                                         # отсоединиться
bind -n C-M-s choose-tree -s -F '#{?session_attached,#[fg=magenta]#[bold],#[fg=blue]}#{session_name}#[default] #[fg=yellow]#{session_windows} windows#[default]#{?session_attached, #[fg=blue][attached],}'
bind -n C-M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!" # релоад
bind -n C-M-Tab last-window                                  # переключить на последнее окно

# --- Закрытие (Ваш запрос) ---
bind -n C-M-q kill-pane                                      # закрыть панель
bind -n C-M-Q confirm-before -p "Kill window? (y/n)" kill-window # закрыть окно (с Shift)

# --- Разделение панелей (Ваш запрос) ---
# w - вертикальная черта (панели слева и справа)
bind -n C-M-w split-window -h -c '#{pane_current_path}'
# e - горизонтальная черта (панели сверху и снизу) - добавил для удобства рядом с w
bind -n C-M-e split-window -v -c '#{pane_current_path}'
# Оставляем старые варианты на всякий случай
bind -n C-M-v split-window -h -c '#{pane_current_path}'
bind -n C-M-h split-window -v -c '#{pane_current_path}'

# --- Зум и ресайз ---
bind -n C-M-z resize-pane -Z                                 # зум (стандартный Z)
bind -n C-M-o resize-pane -Z                                 # зум (альтернатива)

# --- Навигация по окнам ---
bind -n C-M-k next-window                                    # следующее окно
bind -n C-M-j previous-window                                # предыдущее окно
bind -n C-M-l last-window                                    # последнее окно

# --- Перемещение окон ---
bind -n C-M-S-K swap-window -t +1\; select-window -t +1      # сдвинуть вправо
bind -n C-M-S-J swap-window -t -1\; select-window -t -1      # сдвинуть влево


# --- Всплывающее окно (Popup)---

bind-key -n C-g if-shell -F '#{||:#{m:popup_*,#{session_name}},#{==:#{session_name},_global_popups}}' {
    detach-client
} {
    run-shell "tmux display-popup -E -x C -y C -w 88% -h 94% \"tmux_popup '#{session_name}' '#{pane_current_path}'\""
}

# Разрешаем обновление переменных окружения при подключении
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK"

# --- Mouse Copy Fix (для Hyprland / wl-copy) ---

# 1. Для режима vi (если используешь mode-keys vi)
# Когда отпускаешь левую кнопку мыши после выделения -> отправляем в wl-copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# 2. Для стандартного режима (если mode-keys emacs или дефолт)
# То же самое действие
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# bind-key -n C-g if-shell -F '#{m:popup_*,#{session_name}}' {
#     detach-client
# } {
#     run-shell "tmux display-popup -E -x C -y C -w 88% -h 94% \"tmux_popup '#{session_name}' '#{pane_current_path}'\""
# }

# bind-key -n C-g if-shell -F '#{m:popup_*,#{session_name}}' {
#     detach-client
# } {
#     display-popup -E -w 88% -h 94% "tmux_popup '#{session_name}' '#{pane_current_path}'"
# }
# --- Прямой переход к окнам по номерам ---
bind -n C-M-1 select-window -t 1
bind -n C-M-2 select-window -t 2
bind -n C-M-3 select-window -t 3
bind -n C-M-4 select-window -t 4
bind -n C-M-5 select-window -t 5
bind -n C-M-6 select-window -t 6
bind -n C-M-7 select-window -t 7
bind -n C-M-8 select-window -t 8
bind -n C-M-9 select-window -t 9

# --- Copy mode и поиск ---
bind -n C-M-y copy-mode                                      # войти в copy mode
bind -n C-M-c copy-mode                                      # альтернативный вход
bind -n C-M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n C-M-? copy-mode \; command-prompt -p "(search up)" "send -X search-backward '%%%'"

# --- TPM (Плагины) ---
bind -n C-M-I run-shell ~/.config/tmux/plugins/tpm/bindings/install_plugins
bind -n C-M-U run-shell ~/.config/tmux/plugins/tpm/bindings/update_plugins

# ============================================================================
# БИНДИНГИ С ПРЕФИКСОМ (Fallback / Совместимость)
# ============================================================================

bind '\' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind c   new-window   -c '#{pane_current_path}'
bind g   new-window   -n '' lazygit
bind x   kill-pane
bind '<' swap-window -t -1\; select-window -t -1
bind '>' swap-window -t +1\; select-window -t +1

# ============================================================================
# УМНАЯ НАВИГАЦИЯ (Vim + Tmux)
# ============================================================================
# Важно: это позволяет использовать Ctrl+h/j/k/l и в Vim, и в Tmux

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Биндинги без префикса (Ctrl + h/j/k/l)
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Обработка версии tmux для C-\
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Навигация в режиме копирования
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Copy Mode (VI Style)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# Изменение размера с Alt+Shift+стрелки
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

# ============================================================================
# ПЛАГИНЫ
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-fzf-url'

# Настройки плагинов
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '2'

set -g @fzf-url-fzf-options '-w 50% -h 50% --prompt="    " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Инициализация TPM (всегда в конце файла)
run '~/.config/tmux/plugins/tpm/tpm'
