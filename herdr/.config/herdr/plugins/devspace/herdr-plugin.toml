# devspace — herdr-замена tmux-сетапа tconf/tdev/tc
#   workspace "dotfile" — вкладка на каждый stow-пакет ~/Hellkitchen/dotfile (+ repo с lazygit)
#   workspace "config"  — вкладка на каждый каталог ~/.config (кроме stow-симлинков и config.ignore)
#   workspace "work"    — вкладка на каждый проект в ~/Work (+ корень)
#   picker (popup, fzf) — новый dev workspace вокруг каталога проекта
# Все служебные workspace синхронизируются с ФС: на старте, при фокусе на них и по action "sync".

id = "mrscrpt.devspace"
name = "Dev Space"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "dotfile/config/work workspaces synced from the filesystem; fzf picker for dev workspaces"
platforms = ["linux"]

[[startup]]
command = ["bash", "sync.sh", "all"]

# Пришли в dotfile/config -> подхватить новые каталоги (другие workspace игнорируются)
[[events]]
on = "workspace.focused"
command = ["bash", "sync.sh"]

[[actions]]
id = "sync"
title = "Sync dotfile/config/work workspaces"
command = ["bash", "sync.sh", "all"]

[[panes]]
id = "picker"
title = "New dev space"
placement = "popup"
width = "70%"
height = "60%"
command = ["bash", "picker.sh"]
