general {

    # Использование кастомного скрипта omarchy для блокировки (включает интеграцию с 1password и др.)
    lock_cmd = omarchy-lock-screen                         
    # Перед уходом в спящий режим обязательно блокируем сессию
    before_sleep_cmd = loginctl lock-session               
    # После пробуждения ждем 1 секунду (для готовности PAM), затем включаем дисплей
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  
    # Запрещаем уход в сон на 3 секунды, чтобы локер успел гарантированно отрисоваться
    inhibit_sleep = 3                                      
}
# ==========================================
# ЭТАП 1: ЗАСТАВКА (4 часа / 14400 секунд)
# ==========================================
listener {
    timeout = 14400                                           
    # Запускаем кастомную заставку omarchy, только если система еще не заблокирована
    on-timeout = pidof hyprlock || omarchy-launch-screensaver 
}
# ==========================================
# ЭТАП 1.5: ОТКЛЮЧЕНИЕ ЭКРАНОВ И ПОДСВЕТКИ (4 часа 5 минут / 14700 секунд)
# ==========================================
# Я добавил небольшой зазор в 5 минут после включения заставки, чтобы она успела 
# поработать, прежде чем мониторы и клавиатура полностью погаснут для экономии энергии.

listener {
    timeout = 14700                                          
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0  # Выключить подсветку клавиатуры
    on-resume = brightnessctl -rd '*::kbd_backlight'         # Включить при активности
}


listener {
    timeout = 14700                                          
    on-timeout = hyprctl dispatch dpms off                   # Отключить матрицы мониторов
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # Включить мониторы при активности
}

# ==========================================
# ЭТАП 2: БЛОКИРОВКА СИСТЕМЫ (5 часов / 18000 секунд)
# ==========================================
listener {
    timeout = 18000                                          
    # Система блокируется. Вызывается команда из lock_cmd в блоке general
    on-timeout = loginctl lock-session                       
}

# ==========================================
# ЭТАП 3: СПЯЩИЙ РЕЖИМ (6 часов / 21600 секунд)
# ==========================================
# Этого блока не было в оригинальном конфиге omarchy. Теперь через 6 часов
# простоя компьютер будет полностью засыпать, сохраняя сессию в RAM.

listener {
    timeout = 21600                                          
    on-timeout = systemctl suspend                           
}
