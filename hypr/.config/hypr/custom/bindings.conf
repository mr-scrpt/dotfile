# =======================================================================================
# ПЕРЕМЕННЫЕ (VARIABLES)
# =======================================================================================
$mainMod = SUPER
$terminal = uwsm-app -- ghostty
$fileManager = uwsm-app -- nautilus
$browser = uwsm-app -- zen-browser
$menu = omarchy-launch-walker
$sysMenu = omarchy-menu
$scripts = $HOME/.config/hypr/custom/scripts




# =======================================================================================
# НОВАЯ КОНФИГУРАЦИЯ (NEW CONFIGURATION)
# =======================================================================================

# --- Application Launchers (SUPER + SHIFT) ---
bindd = $mainMod SHIFT, RETURN, Terminal,      exec, $terminal
bindd = $mainMod SHIFT, B,      Web Browser,   exec, $browser
bindd = $mainMod SHIFT, F,      File Manager,  exec, $fileManager

# --- Menus & Utilities (SUPER + ALT) ---
# Main Launcher (Используем переменную $menu)
bindd = $mainMod, SPACE,        App Launcher,      exec, $menu
# bindd = SUPER, SPACE, Launch apps, exec, omarchy-launch-walker

# --- Config Reloads (SUPER + ALT + R) ---
# Единое меню для перезагрузки конфигов
bindd = $mainMod ALT, R,        Reload Menu,       exec, $scripts/reload/menu-reload.sh


bindd = $mainMod ALT, SPACE,    Omarchy Menu,      exec, $sysMenu
bindd = $mainMod ALT, ESCAPE,   System/Power Menu, exec, $sysMenu system
bindd = $mainMod ALT, E,        Emoji Picker,      exec, $menu -m symbols
bindd = $mainMod ALT, S,        Share Menu,        exec, $sysMenu share
bindd = $mainMod ALT, K,        Show Keybindings,  exec, omarchy-menu-keybindings
bindd = $mainMod ALT, V,        Clipboard Manager, exec, $menu -m clipboard
bindd = $mainMod ALT, T,        Theme Menu,        exec, $sysMenu theme

# --- Window Management (SUPER) ---
bindd = $mainMod SHIFT, Q, Close Active Window, killactive,
bindd = $mainMod SHIFT, S, Toggle Split,        togglesplit,  # dwindle (Замена для J)
bindd = $mainMod, M,       Toggle Fullscreen,   fullscreen, 0
bindd = $mainMod, F,       Toggle Floating,     togglefloating,
bindd = $mainMod, P,       Pseudo Tiling,       pseudo,       # dwindle

# Focus (Vim-style HJKL)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move Window (Shift + Vim-style HJKL)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Swap Windows (Ctrl + Vim-style HJKL)
bind = $mainMod CTRL, H, swapwindow, l
bind = $mainMod CTRL, L, swapwindow, r
bind = $mainMod CTRL, K, swapwindow, u
bind = $mainMod CTRL, J, swapwindow, d

# Resize Window (Arrow Keys)
# Мы освободили эти клавиши в секции UNBIND (раньше они меняли фокус)
binde = $mainMod, RIGHT, resizeactive, 20 0
binde = $mainMod, LEFT,  resizeactive, -20 0
binde = $mainMod, UP,    resizeactive, 0 -20
binde = $mainMod, DOWN,  resizeactive, 0 20

# --- Workspaces (Standard 1-9) ---
# Переключение (остается стандартным SUPER+1..9, анбинд не нужен)

# Move active window to workspace (SUPER + SHIFT + 1..9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move window silently (SUPER + ALT + 1..9)
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9

# --- Monitors (TAB) ---
# Focus next monitor (Замена для Workspace Cycle)
bind = $mainMod, TAB, focusmonitor, +1

# Move window to next monitor
bind = $mainMod SHIFT, TAB, movewindow, mon:+1

# --- Mouse Bindings ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

