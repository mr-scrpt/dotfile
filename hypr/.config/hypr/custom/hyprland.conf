# Запуск демона
exec-once = sleep 10 && pypr

# --- ГЛАВНОЕ ПРАВИЛО ---
windowrule = float on, match:initial_title ^(scratch-[uilhm])$
windowrule = center on, match:initial_title ^(scratch-[uilhm])$

# --- ВИДЕОПЛЕЕР ---
# Celluloid не знаком omarchy, поэтому floating/opacity задаём сами (как у mpv и imv).
# Окно шире дефолтных 875x600, потому что панель плейлиста съедает ~280px.
# Тег floating-window omarchy не используем: он жёстко навязывает size 875 600,
# и это перебивает наш размер. Поэтому те же свойства задаём напрямую.
windowrule = float on, match:class ^(io\.github\.celluloid_player\.Celluloid)$
windowrule = center on, match:class ^(io\.github\.celluloid_player\.Celluloid)$
windowrule = size 1400 850, match:class ^(io\.github\.celluloid_player\.Celluloid)$
windowrule = tag -default-opacity, match:class ^(io\.github\.celluloid_player\.Celluloid)$
windowrule = opacity 1 1, match:class ^(io\.github\.celluloid_player\.Celluloid)$

# --- ПРИВЯЗКА К WORKSPACE ---
windowrule = workspace special:scratch_u silent, match:initial_title ^(scratch-u)$
windowrule = workspace special:scratch_i silent, match:initial_title ^(scratch-i)$
windowrule = workspace special:scratch_l silent, match:initial_title ^(scratch-l)$
windowrule = workspace special:scratch_h silent, match:initial_title ^(scratch-h)$
windowrule = workspace special:scratch_m silent, match:initial_title ^(scratch-m)$
