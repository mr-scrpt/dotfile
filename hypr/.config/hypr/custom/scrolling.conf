# ─── Layout ───────────────────────────────────────────────────────────────────
general {
    layout = scrolling
}

scrolling {
    column_width = 0.492          # дефолт для DP-1, HDMI-A-1 перекрывается скриптом
    fullscreen_on_one_column = true
    focus_fit_method = 1
    follow_focus = false

    explicit_column_widths = 0.3, 0.5, 0.7, 1.0
}

# ─── Autostart ────────────────────────────────────────────────────────────────
# Убрать / не добавлять:
#   exec-once = sleep 3 && hyprctl keyword general:layout scrolling  ← больше не нужно
#   exec-once = hyprpm reload -n                                      ← плагин не нужен
#   exec = ~/.config/hypr/custom/scripts/scroll/reload_layout.sh     ← убрать

# Оставить (со скриптом, адаптированным под нативный неймспейс):
exec-once = ~/.config/hypr/custom/scripts/scroll/scroll_layout.sh

# ─── Hotkeys ──────────────────────────────────────────────────────────────────

# Навигация по колонкам
bind = $mainMod, H, layoutmsg, move -col
bind = $mainMod, L, layoutmsg, move +col

# Навигация по окнам внутри колонки
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Перемещение окна между колонками
# ⚠ layoutmsg movewindowto в нативном нет — используем стандартный movewindow
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Swap колонок
bind = $mainMod CTRL, H, layoutmsg, swapcol l
bind = $mainMod CTRL, L, layoutmsg, swapcol r

# Promote — вынести окно в отдельную колонку
bind = $mainMod SHIFT, I, layoutmsg, promote

# Fit — вписать активное окно / все видимые в экран
# bind = $mainMod, F, layoutmsg, fit active
# bind = $mainMod SHIFT, F, layoutmsg, fit visible

# Resize текущей колонки
bind = $mainMod ALT, H, layoutmsg, colresize -0.05
bind = $mainMod ALT, L, layoutmsg, colresize +0.05

# Cycle по заданным ширинам (explicit_column_widths: 0.333 / 0.5 / 0.667 / 1.0)
bind = $mainMod, bracketright, layoutmsg, colresize +conf
bind = $mainMod, bracketleft,  layoutmsg, colresize -conf
