# =======================================================================================
# ОЧИСТКА КОНФЛИКТОВ (UNBIND DEFAULT SETTINGS)
# =======================================================================================
# Мы отключаем только то, что переопределяем или удаляем.

# --- App Launchers (Переносим с SUPER на SUPER+SHIFT) ---
unbind = SUPER, RETURN   # Был: Terminal
unbind = SUPER, F        # Был: File Manager -> Станет: Floating
unbind = SUPER, B        # Был: Browser
unbind = SUPER, M        # Был: Music -> Станет: Fullscreen
unbind = SUPER, N        # Был: Neovim
unbind = SUPER, T        # Был: Top
unbind = SUPER, D        # Был: Docker
unbind = SUPER, G        # Был: Messenger
unbind = SUPER, O        # Был: Obsidian
unbind = SUPER, SLASH    # Был: Password Manager

# --- Window Management (Переопределяем навигацию и управление) ---
unbind = SUPER, W        # Был: Close Window -> Переносим на SHIFT+Q
unbind = SUPER, Q        # На случай если там что-то было
unbind = SUPER, J        # Был: Toggle Split -> Переносим на SHIFT+S
unbind = SUPER, K        # Был: Keybindings -> Переносим на ALT+K
unbind = SUPER, P        # Был: Pseudo -> Переопределяем явно

# --- Navigation (Отключаем стрелки для фокуса, чтобы использовать их для ресайза) ---
unbind = SUPER, LEFT     # Был: Move Focus Left -> Станет: Resize
unbind = SUPER, RIGHT    # Был: Move Focus Right -> Станет: Resize
unbind = SUPER, UP       # Был: Move Focus Up -> Станет: Resize
unbind = SUPER, DOWN     # Был: Move Focus Down -> Станет: Resize

# --- Move Windows (Отключаем Shift+Стрелки, переносим на Shift+HJKL) ---
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN

# --- Workspaces & Monitors (Переопределяем TAB) ---
unbind = SUPER, TAB          # Был: Next Workspace -> Станет: Focus Monitor
unbind = SUPER SHIFT, TAB    # Был: Prev Workspace -> Станет: Move to Monitor
unbind = SUPER CTRL, TAB     # Был: Former Workspace

# --- Menus (Переопределяем системные меню) ---
unbind = SUPER, ESCAPE       # Был: System Menu -> Станет: (Освобожден)
unbind = SUPER SHIFT, ESCAPE # На всякий случай
unbind = SUPER ALT, SPACE    # Был: Omarchy Menu -> Переносим на ALT+SPACE (здесь переопределение)
unbind = SUPER SHIFT CTRL, SPACE # Был: Theme Menu -> Переносим на ALT+T
unbind = SUPER, SPACE # Был: Главное меню

# --- Groups (Отключаем стандартные группы, чтобы не мешали) ---
unbind = SUPER, G
unbind = SUPER CTRL, G
unbind = ALT, TAB            # Был: Cycle Windows

# --- CLIPBOARD ---
# Отключаем стандартный бинд на SUPER+CTRL+V
unbind = SUPER CTRL, V

# Логин
unbind = SUPER CTRL, L


unbind = SUPER, L
# unbind = SUPER SHIFT, F


