#  hypr/.config/hypr/custom/monitors.conf
env = GDK_SCALE,2

# DP-1 (AORUS FO48U) временно отключён 2026-08-16 — монитор стоит далеко от компьютера.
# Чтобы вернуть: закомментировать строку disable, раскомментировать строку с режимом.
# monitor=DP-1, 3840x2160@120, 0x0, 1.066667, bitdepth,10
monitor=DP-1, disable


monitor=HDMI-A-1, 2560x1440@144, 840x2025, 1.3333
