# --- DUAL PANE (split-tabs.yazi) ---
# Панель = вкладка yazi. Обе рисуются рядом в одном процессе,
# поэтому yank/paste между ними работает через общий буфер.
# Превью включается сразу вместе с панелями: плагин стартует с preview = false,
# поэтому вторым шагом сразу его переключаем. При выключении режима второй вызов
# безопасно no-op — spl_preview выходит раньше, если дуальный режим не активен.
[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = [ "plugin split-tabs spl_toggle", "plugin split-tabs spl_preview" ]
desc = "Dual Pane: вкл/выкл две панели (с превью)"

[[mgr.prepend_keymap]]
on   = "<Tab>"
run  = "plugin split-tabs spl_switch_tab"
desc = "Dual Pane: переключить панель"

[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "plugin split-tabs spl_preview"
desc = "Dual Pane: превью во всю ширину"

# <Tab> по умолчанию был "spot" — переносим, чтобы не потерять
[[mgr.prepend_keymap]]
on   = "<A-s>"
run  = "spot"
desc = "Spot hovered file (раньше был <Tab>)"


[[mgr.prepend_keymap]]
on  = "<C-n>"
run = 'shell -- ripdrag "$@"'
desc = "Drag and drop via Ripdrag"

[[mgr.prepend_keymap]]
on   = "y"
run  = [ 'shell -- for path in "$@"; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
desc = "Yank and copy to clipboard"

[[mgr.prepend_keymap]]
on   = [ "c", "a" ]
run  = "plugin compress"
desc = "Archive selected files"


