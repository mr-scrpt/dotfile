# Указываем палитру Catppuccin
palette = "catppuccin_mocha"

# Двухстрочный формат: Инфо -> Перенос строки -> Ввод
format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

[directory]
style = "bold blue"
# Убеждаемся, что путь отображается всегда. 
# truncation_length определяет, сколько папок показывать перед обрезанием.
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
# Чтобы путь не "прятался" внутри репозиториев
truncate_to_repo = false 

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
# Динамическое отображение: если статуса нет (например, up_to_date), он будет пустым
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
# Оставляем ПУСТЫМИ те значки, которые не должны светиться просто так
up_to_date = "" 
conflicted = "󰞇 "
ahead = "⇡"
behind = "⇣"
diverged = "↕"
untracked = "[?](yellow) "
modified = "[!](yellow) "
staged = "[+](green) "
renamed = "» "
deleted = "✘ "
stashed = "≡ "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

