# Переопределяет omarchy-defaults из:
#   ~/.local/share/omarchy/default/hypr/looknfeel.conf
# Прозрачность терминала задаётся в ~/.config/ghostty/config (background-opacity = 0.85).

# Активный пресет анимаций. Симлинк управляется командой:
#   ln -snf "<имя>.conf" ~/.config/hypr/animations/current.conf
source = ~/.config/hypr/animations/current.conf

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 3
        brightness = 1.1     # «свечение» — главный фактор «матовости»
        contrast = 0.95      # чуть мягче, чтобы не было резких цветов
        vibrancy = 0.3       # сочнее, цвета не уходят в серую кашу
        vibrancy_darkness = 0.5  # затемняет тени — меньше «грязных» тёмных пятен
        noise = 0.02         # зерно стекла (главный признак матового!)
        xray = true
        popups = false
    }
}
