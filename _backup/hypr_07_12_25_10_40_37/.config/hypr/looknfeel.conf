# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Ты уже отключил блюр, это правильно
    blur {
        enabled = false
    }
    
    # 1. Отключаем тени (Shadows). Они очень сильно влияют на FPS при движении окон.
    shadow {
        enabled = false
    }
    rounding = 4

    # 2. Принудительно ставим непрозрачность на 100%. 
    # Если где-то в базовом конфиге есть 0.9, это заставляет GPU рендерить обои под окнами при каждом кадре анимации.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # 3. Создаем самую простую "линейную" кривую.
    # Сложные кривые (bezier) требуют математики, linear — нет.
    bezier = linear, 0, 0, 1, 1

    # 4. Делаем анимации очень быстрыми (2-3 тика) и линейными.
    # windowsMove — отвечает за перемещение окон
    # workspaces — отвечает за переключение воркспейсов (самое лагучее место)
    animation = windows, 1, 2, linear
    animation = workspaces, 1, 2, linear
    
    # Отключаем Fade (изменение прозрачности при появлении), так как мы боремся с прозрачностью
    animation = fade, 0
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # 5. Отключаем анимацию при изменении размера мышью (очень тяжелая операция)
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}
